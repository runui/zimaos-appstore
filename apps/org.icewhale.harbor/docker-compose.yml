name: harbor
services:
  log:
    image: goharbor/harbor-log:v2.15.1
    container_name: harbor-log
    restart: unless-stopped
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - SETGID
    - SETUID
    volumes:
    - /DATA/AppData/$AppID/data/log:/var/log/docker
    - type: bind
      source: ./common/config/log/logrotate.conf
      target: /etc/logrotate.d/logrotate.conf
    - type: bind
      source: ./common/config/log/rsyslog_docker.conf
      target: /etc/rsyslog.d/rsyslog_docker.conf
    ports:
    - target: 10514
      published: '1514'
      protocol: tcp
    networks:
    - harbor
  registry:
    image: goharbor/registry-photon:v2.15.1
    container_name: registry
    restart: unless-stopped
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - SETGID
    - SETUID
    volumes:
    - /DATA/AppData/$AppID/data/registry:/storage
    - type: bind
      source: ./common/config/registry
      target: /etc/registry
    - type: bind
      source: ./secrets/registry/root.crt
      target: /etc/registry/root.crt
    - type: bind
      source: ./common/config/shared/trust-certificates
      target: /harbor_cust_cert
    networks:
    - harbor
    depends_on:
    - log
    logging:
      driver: syslog
      options:
        syslog-address: tcp://127.0.0.1:1514
        tag: registry
  registryctl:
    image: goharbor/harbor-registryctl:v2.15.1
    container_name: registryctl
    env_file:
    - ./common/config/registryctl/env
    restart: unless-stopped
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - SETGID
    - SETUID
    volumes:
    - /DATA/AppData/$AppID/data/registry:/storage
    - type: bind
      source: ./common/config/registry
      target: /etc/registry
    - type: bind
      source: ./common/config/registryctl/config.yml
      target: /etc/registryctl/config.yml
    - type: bind
      source: ./common/config/shared/trust-certificates
      target: /harbor_cust_cert
    networks:
    - harbor
    depends_on:
    - log
    logging:
      driver: syslog
      options:
        syslog-address: tcp://127.0.0.1:1514
        tag: registryctl
  postgresql:
    image: goharbor/harbor-db:v2.15.1
    container_name: harbor-db
    restart: unless-stopped
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - SETGID
    - SETUID
    volumes:
    - /DATA/AppData/$AppID/data/database:/var/lib/postgresql/data
    networks:
    - harbor
    env_file:
    - ./common/config/db/env
    depends_on:
    - log
    logging:
      driver: syslog
      options:
        syslog-address: tcp://127.0.0.1:1514
        tag: postgresql
    shm_size: 1gb
  core:
    image: goharbor/harbor-core:v2.15.1
    container_name: harbor-core
    env_file:
    - ./common/config/core/env
    restart: unless-stopped
    cap_drop:
    - ALL
    cap_add:
    - SETGID
    - SETUID
    volumes:
    - /DATA/AppData/$AppID/data/ca_download:/etc/core/ca
    - /DATA/AppData/$AppID/data:/data
    - type: bind
      source: ./common/config/core/certificates
      target: /etc/core/certificates
    - type: bind
      source: ./common/config/core/app.conf
      target: /etc/core/app.conf
    - type: bind
      source: ./secrets/core/private_key.pem
      target: /etc/core/private_key.pem
    - type: bind
      source: ./secrets/keys/secretkey
      target: /etc/core/key
    - type: bind
      source: ./common/config/shared/trust-certificates
      target: /harbor_cust_cert
    networks:
    - harbor
    depends_on:
    - log
    - registry
    - redis
    - postgresql
    logging:
      driver: syslog
      options:
        syslog-address: tcp://127.0.0.1:1514
        tag: core
  portal:
    image: goharbor/harbor-portal:v2.15.1
    container_name: harbor-portal
    restart: unless-stopped
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - SETGID
    - SETUID
    - NET_BIND_SERVICE
    volumes:
    - type: bind
      source: ./common/config/portal/nginx.conf
      target: /etc/nginx/nginx.conf
    networks:
    - harbor
    depends_on:
    - log
    logging:
      driver: syslog
      options:
        syslog-address: tcp://127.0.0.1:1514
        tag: portal
  jobservice:
    image: goharbor/harbor-jobservice:v2.15.1
    container_name: harbor-jobservice
    env_file:
    - ./common/config/jobservice/env
    restart: unless-stopped
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - SETGID
    - SETUID
    volumes:
    - /DATA/AppData/$AppID/data/job_logs:/var/log/jobs
    - type: bind
      source: ./common/config/jobservice/config.yml
      target: /etc/jobservice/config.yml
    - type: bind
      source: ./common/config/shared/trust-certificates
      target: /harbor_cust_cert
    networks:
    - harbor
    depends_on:
    - core
    logging:
      driver: syslog
      options:
        syslog-address: tcp://127.0.0.1:1514
        tag: jobservice
  redis:
    image: goharbor/valkey-photon:v2.15.1-dev
    container_name: redis
    restart: unless-stopped
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - SETGID
    - SETUID
    volumes:
    - /DATA/AppData/$AppID/data/redis:/var/lib/redis
    networks:
    - harbor
    depends_on:
    - log
    logging:
      driver: syslog
      options:
        syslog-address: tcp://127.0.0.1:1514
        tag: redis
  proxy:
    image: goharbor/nginx-photon:v2.15.1
    container_name: nginx
    restart: unless-stopped
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - SETGID
    - SETUID
    - NET_BIND_SERVICE
    volumes:
    - type: bind
      source: ./common/config/nginx
      target: /etc/nginx
    - type: bind
      source: ./common/config/shared/trust-certificates
      target: /harbor_cust_cert
    networks:
    - harbor
    ports:
    - target: 8080
      published: '18080'
      protocol: tcp
    depends_on:
    - registry
    - core
    - portal
    - log
    logging:
      driver: syslog
      options:
        syslog-address: tcp://127.0.0.1:1514
        tag: proxy
networks:
  harbor:
    external: false
x-casaos:
  id: org.icewhale.harbor
  main: proxy
  index: /
  port_map: '18080'
  scheme: http
  title:
    en_US: Harbor
    zh_CN: Harbor
  icon: https://cdn.jsdelivr.net/gh/runui/zimaos-appstore@gh-pages/apps/org.icewhale.harbor/assets/icon.svg
  version: 2.15.1
