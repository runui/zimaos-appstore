name: duckdns
services:
  duckdns:
    image: lscr.io/linuxserver/duckdns@sha256:903e0085aef531c68f1ad27c055ac40c4f76f46b088ada755022140e20f876f3
    container_name: duckdns
    network_mode: host
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - SUBDOMAINS=subdomain1,subdomain2
    - TOKEN=token
    - UPDATE_IP=ipv6
    - LOG_FILE=false
    volumes:
    - /DATA/AppData/duckdns:/config
    restart: unless-stopped
x-casaos:
  main: duckdns
  icon: https://cdn.jsdelivr.net/gh/runui/zimaos-appstore@gh-pages/apps/duckdns/assets/icon.svg
  title: duckdns
  index: /
  version: latest
