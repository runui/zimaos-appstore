name: harbor
services:
  log:
    image: goharbor/harbor-log:v2.15.1
    container_name: harbor-log
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    volumes:
      - /DATA/AppData/$AppID/data/log:/var/log/docker
      - type: bind
        source: ./common/config/log/logrotate.conf
        target: /etc/logrotate.d/logrotate.conf
      - type: bind
        source: ./common/config/log/rsyslog_docker.conf
        target: /etc/rsyslog.d/rsyslog_docker.conf
    ports:
      - target: 10514
        published: "1514"
        protocol: tcp
    networks:
      - harbor

  registry:
    image: goharbor/registry-photon:v2.15.1
    container_name: registry
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    volumes:
      - /DATA/AppData/$AppID/data/registry:/storage
      - type: bind
        source: ./common/config/registry
        target: /etc/registry
      - type: bind
        source: ./secrets/registry/root.crt
        target: /etc/registry/root.crt
      - type: bind
        source: ./common/config/shared/trust-certificates
        target: /harbor_cust_cert
    networks:
      - harbor
    depends_on:
      - log
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://127.0.0.1:1514"
        tag: "registry"

  registryctl:
    image: goharbor/harbor-registryctl:v2.15.1
    container_name: registryctl
    env_file:
      - ./common/config/registryctl/env
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    volumes:
      - /DATA/AppData/$AppID/data/registry:/storage
      - type: bind
        source: ./common/config/registry
        target: /etc/registry
      - type: bind
        source: ./common/config/registryctl/config.yml
        target: /etc/registryctl/config.yml
      - type: bind
        source: ./common/config/shared/trust-certificates
        target: /harbor_cust_cert
    networks:
      - harbor
    depends_on:
      - log
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://127.0.0.1:1514"
        tag: "registryctl"

  postgresql:
    image: goharbor/harbor-db:v2.15.1
    container_name: harbor-db
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    volumes:
      - /DATA/AppData/$AppID/data/database:/var/lib/postgresql/data
    networks:
      - harbor
    env_file:
      - ./common/config/db/env
    depends_on:
      - log
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://127.0.0.1:1514"
        tag: "postgresql"
    shm_size: "1gb"

  core:
    image: goharbor/harbor-core:v2.15.1
    container_name: harbor-core
    env_file:
      - ./common/config/core/env
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    volumes:
      - /DATA/AppData/$AppID/data/ca_download:/etc/core/ca
      - /DATA/AppData/$AppID/data:/data
      - type: bind
        source: ./common/config/core/certificates
        target: /etc/core/certificates
      - type: bind
        source: ./common/config/core/app.conf
        target: /etc/core/app.conf
      - type: bind
        source: ./secrets/core/private_key.pem
        target: /etc/core/private_key.pem
      - type: bind
        source: ./secrets/keys/secretkey
        target: /etc/core/key
      - type: bind
        source: ./common/config/shared/trust-certificates
        target: /harbor_cust_cert
    networks:
      - harbor
    depends_on:
      - log
      - registry
      - redis
      - postgresql
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://127.0.0.1:1514"
        tag: "core"

  portal:
    image: goharbor/harbor-portal:v2.15.1
    container_name: harbor-portal
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    volumes:
      - type: bind
        source: ./common/config/portal/nginx.conf
        target: /etc/nginx/nginx.conf
    networks:
      - harbor
    depends_on:
      - log
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://127.0.0.1:1514"
        tag: "portal"

  jobservice:
    image: goharbor/harbor-jobservice:v2.15.1
    container_name: harbor-jobservice
    env_file:
      - ./common/config/jobservice/env
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    volumes:
      - /DATA/AppData/$AppID/data/job_logs:/var/log/jobs
      - type: bind
        source: ./common/config/jobservice/config.yml
        target: /etc/jobservice/config.yml
      - type: bind
        source: ./common/config/shared/trust-certificates
        target: /harbor_cust_cert
    networks:
      - harbor
    depends_on:
      - core
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://127.0.0.1:1514"
        tag: "jobservice"

  redis:
    image: goharbor/valkey-photon:v2.15.1-dev
    container_name: redis
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    volumes:
      - /DATA/AppData/$AppID/data/redis:/var/lib/redis
    networks:
      - harbor
    depends_on:
      - log
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://127.0.0.1:1514"
        tag: "redis"

  proxy:
    image: goharbor/nginx-photon:v2.15.1
    container_name: nginx
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    volumes:
      - type: bind
        source: ./common/config/nginx
        target: /etc/nginx
      - type: bind
        source: ./common/config/shared/trust-certificates
        target: /harbor_cust_cert
    networks:
      - harbor
    ports:
      - target: 8080
        published: "18080"
        protocol: tcp
    depends_on:
      - registry
      - core
      - portal
      - log
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://127.0.0.1:1514"
        tag: "proxy"

networks:
  harbor:
    external: false

x-casaos:
  id: org.icewhale.harbor
  main: proxy
  index: /
  port_map: "18080"
  scheme: http
  title:
    en_US: Harbor
    zh_CN: Harbor
  icon: https://cdn.jsdelivr.net/gh/runui/zimaos-appstore@selfhost/Apps/Harbor/icon.svg
  thumbnail: https://cdn.jsdelivr.net/gh/runui/zimaos-appstore@selfhost/Apps/Harbor/thumbnail.png
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/runui/zimaos-appstore@selfhost/Apps/Harbor/screenshot-1.png
  tagline:
    en_US: Cloud Native Registry
    zh_CN: 云原生镜像仓库
  description:
    en_US: |
      Harbor is an open source trusted cloud native registry project that stores, signs, and scans container images. Harbor extends the open source Docker Distribution by adding features like security, identity and management. This package includes Harbor core, portal, jobservice, registry, PostgreSQL, and Valkey (Redis-compatible cache). Supports image replication, vulnerability scanning (via Trivy, optional), and role-based access control.

      Default credentials: admin / Harbor12345
    zh_CN: |
      Harbor 是一个开源的云原生镜像仓库项目，用于存储、签名和扫描容器镜像。它在 Docker Distribution 的基础上扩展了安全、身份和管理等功能。此软件包包含 Harbor 核心服务、Web 门户、任务服务、镜像仓库、PostgreSQL 数据库和 Valkey 缓存（兼容 Redis）。支持镜像复制、漏洞扫描（可选，需 Trivy 组件）和基于角色的访问控制。

      默认登录凭据: admin / Harbor12345
  tips:
    before_install:
      en_US: |
        Harbor is a large application that requires at least 4 GB of RAM and 2 CPU cores. Initial startup may take 2-3 minutes while PostgreSQL initializes and all services become healthy.

        Default admin credentials: admin / Harbor12345
        Change the admin password from the Web UI after installation.

        The registry is accessible on port 18080. To push/pull images, configure your Docker daemon with the registry address.
      zh_CN: |
        Harbor 是一个大型应用，至少需要 4 GB 内存和 2 个 CPU 核心。首次启动可能需要 2-3 分钟，等待 PostgreSQL 初始化和所有服务就绪。

        默认管理员凭据: admin / Harbor12345
        安装后请通过 Web UI 修改管理员密码。

        镜像仓库端口为 18080。推送/拉取镜像前，需要配置 Docker 守护进程的仓库地址。
  author: IceWhaleTech
  developer: CNCF / GoHarbor
  category: Developer
  architectures:
    - amd64
    - arm64
  version: "2.15.1"
  updateAt: "2026-06-28"
  releaseNotes:
    en_US: |-
      - Harbor v2.15.1 stable release.
      - Includes core, portal, jobservice, registry, PostgreSQL, and Valkey (Redis-compatible cache).
      - No Trivy scanner included by default; add it later if vulnerability scanning is needed.
      - Default admin: admin / Harbor12345. Change after first login.
    zh_CN: |-
      - Harbor v2.15.1 稳定版本。
      - 包含核心服务、Web 门户、任务服务、镜像仓库、PostgreSQL 数据库和 Valkey 缓存。
      - 默认不包含 Trivy 扫描器，如需漏洞扫描可后续添加。
      - 默认管理员: admin / Harbor12345。首次登录后请修改密码。
  website: https://goharbor.io
  repo: https://github.com/goharbor/harbor
  support: https://github.com/goharbor/harbor/discussions
  docs: https://goharbor.io/docs/2.15.0
