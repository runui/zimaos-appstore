  release_notes:
    en_US: Initial ZimaOS AppStore packaging of the Motrix v2 headless server, built from upstream commit 7991744 (ghcr.io/runui/motrix-server:7991744).
    zh_CN: 首次将 Motrix v2 无头服务器打包为 ZimaOS 应用，镜像由上游提交 7991744 构建（ghcr.io/runui/motrix-server:7991744）。
  website: https://motrix.app
  repo: https://github.com/agalwood/Motrix
  support: https://github.com/agalwood/Motrix/issues
  docs: https://github.com/agalwood/Motrix/blob/main/docs/docker-server.md
